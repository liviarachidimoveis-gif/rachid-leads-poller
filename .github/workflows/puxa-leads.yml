name: Puxa leads do Meta pro CRM
# Repo PUBLICO = Actions ilimitado, entao o robo roda em LOOP CONTINUO: le os leads do Meta a
# cada 2 min sozinho, sem precisar de gatilho externo. Le de um IP que o Meta libera (o da Vercel
# e bloqueado). Janela de 3 dias + criacao idempotente no CRM = nenhum lead se perde.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"   # so pra reiniciar o loop caso ele caia; a cadencia real e o loop interno
concurrency:
  group: poller
  cancel-in-progress: true    # cada reinicio troca o loop antigo pelo novo (sem empilhar)
jobs:
  puxa:
    runs-on: ubuntu-latest
    timeout-minutes: 330       # ~5,5h de loop (teto do GitHub e 6h); depois o schedule reinicia
    steps:
      - name: Loop de leitura
        env:
          META_LEADS_TOKEN: ${{ secrets.META_LEADS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          CRM_WEBHOOK: "https://crm-rachid24.vercel.app/api/webhooks/meta-leads"
          INTERVALO_SEG: "120"
          RODADAS: "160"
          JANELA_MIN: "4320"
        run: |
          node -e '
          const T=process.env.META_LEADS_TOKEN, PAGE=process.env.META_PAGE_ID, G="https://graph.facebook.com/v20.0";
          const INTERVALO=Number(process.env.INTERVALO_SEG||"120")*1000, RODADAS=Number(process.env.RODADAS||"160"), JAN=Number(process.env.JANELA_MIN||"4320");
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function ptok(){ try{ return (await (await fetch(G+"/"+PAGE+"?fields=access_token&access_token="+T)).json()).access_token||T; }catch{ return T; } }
          async function umaRodada(pt){
            const corte=Date.now()-JAN*60*1000;
            const forms=((await (await fetch(G+"/"+PAGE+"/leadgen_forms?fields=id,name,status&limit=200&access_token="+pt)).json()).data||[]).filter(f=>(f.status||"").toUpperCase()==="ACTIVE");
            let enviados=0, erros=0;
            for(const f of forms){ try{
              const l=await (await fetch(G+"/"+f.id+"/leads?fields=id,created_time,field_data,campaign_name,ad_name&limit=50&access_token="+pt)).json();
              for(const x of (l.data||[])){ if(Date.parse(x.created_time)<corte) continue;
                const body={object:"page",entry:[{id:PAGE,changes:[{field:"leadgen",value:{leadgen_id:x.id,page_id:PAGE,form_id:f.id,lead:{field_data:x.field_data,campaign_name:x.campaign_name,ad_name:x.ad_name,form_name:f.name}}}]}]};
                const r=await fetch(process.env.CRM_WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
                if(r.ok) enviados++; else erros++;
              }
            }catch(e){ erros++; } }
            return {forms:forms.length, enviados, erros};
          }
          (async()=>{
            for(let i=0;i<RODADAS;i++){
              try{ const pt=await ptok(); const r=await umaRodada(pt); console.log(new Date().toISOString(), "rodada", i+1, JSON.stringify(r)); }
              catch(e){ console.log(new Date().toISOString(), "rodada", i+1, "erro", e.message); }
              if(i<RODADAS-1) await sleep(INTERVALO);
            }
            console.log("loop terminou; o schedule reinicia");
          })();
          '
